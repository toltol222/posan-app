<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포산중학교 고입 정보 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg:#f5f3ee; --surface:#fff; --border:#e2ddd5; --border-dark:#ccc7be;
  --text:#1a1814; --muted:#7a7670; --hint:#b0aba5;
  --accent:#2d5a8e; --accent-light:#e8f0f9;
  --success:#1a6b40; --success-bg:#e4f5ec;
  --warning:#8a5200; --warning-bg:#fdf3e8;
  --step-bg:#f8f7f4;
  --tag-special:#f0eafa; --tag-special-t:#5b3d9e;
  --tag-master:#e4f5ec; --tag-master-t:#1a6b40;
  --tag-normal:#f0ede8; --tag-normal-t:#6b5e4e;
  --tag-gifted:#fff4e0; --tag-gifted-t:#8a5a00;
  --tag-auto:#e8f0f9; --tag-auto-t:#1e4a7a;
  --tag-voca:#fceef0; --tag-voca-t:#8a2040;
  --tag-jeon:#fdf3e8; --tag-jeon-t:#8a5200;
  --tag-hu:#e8f5f0; --tag-hu-t:#1a6b50;
  --r:10px; --rl:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:3rem 2.5rem;width:100%;max-width:380px}
.login-box h1{font-family:'Noto Serif KR',serif;font-size:1.35rem;font-weight:600;margin-bottom:.35rem}
.login-box .sub{font-size:.82rem;color:var(--muted);margin-bottom:2rem}
.login-box label{display:block;font-size:.75rem;font-weight:500;color:var(--muted);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.login-box input{width:100%;padding:.65rem .9rem;border:1px solid var(--border);border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:.95rem;background:var(--bg);color:var(--text);margin-bottom:1.1rem;outline:none;transition:border-color .2s}
.login-box input:focus{border-color:var(--accent);background:#fff}
.login-btn{width:100%;padding:.75rem;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:.95rem;font-weight:500;cursor:pointer;transition:opacity .2s}
.login-btn:hover{opacity:.88}
.login-err{font-size:.82rem;color:#c0392b;margin-top:.8rem;text-align:center;display:none}

/* ── APP ── */
#app{display:none}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-family:'Noto Serif KR',serif;font-size:1.1rem;font-weight:600}
.user-info{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.logout-btn{font-size:.76rem;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:4px 11px;cursor:pointer;transition:all .15s}
.logout-btn:hover{background:var(--bg);color:var(--text)}

/* ── NAV TABS ── */
.nav-tabs{display:flex;gap:4px;padding:.75rem 2rem 0;background:var(--surface);border-bottom:1px solid var(--border)}
.tab-btn{padding:.55rem 1.1rem;font-family:'Noto Sans KR',sans-serif;font-size:.86rem;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tab-btn:hover:not(.active){color:var(--text)}

/* ── CONTAINER ── */
.container{max-width:900px;margin:0 auto;padding:1.75rem 1.5rem}

/* ── FILTERS ── */
.filters{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1.1rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=text]{flex:1;min-width:180px;padding:.48rem .8rem;border:1px solid var(--border);border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:.87rem;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.filters input[type=text]:focus{border-color:var(--accent);background:#fff}
.filters select{padding:.48rem .8rem;border:1px solid var(--border);border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:.84rem;background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.result-count{font-size:.79rem;color:var(--muted);margin-bottom:.85rem;padding-left:2px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.2rem 1.4rem;margin-bottom:10px;transition:border-color .18s}
.card:hover{border-color:var(--border-dark)}
.card-title{font-size:1.02rem;font-weight:500;margin:6px 0 4px}
.card-preview{font-size:.83rem;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;font-size:.7rem;padding:3px 8px;border-radius:5px;margin-right:4px;margin-bottom:3px;font-weight:500}
.b-special{background:var(--tag-special);color:var(--tag-special-t)}
.b-master{background:var(--tag-master);color:var(--tag-master-t)}
.b-normal{background:var(--tag-normal);color:var(--tag-normal-t)}
.b-gifted{background:var(--tag-gifted);color:var(--tag-gifted-t)}
.b-tasido{background:#e8f4e8;color:#2d6a2d}
.b-auto{background:var(--tag-auto);color:var(--tag-auto-t)}
.b-voca{background:var(--tag-voca);color:var(--tag-voca-t)}
.b-jeon{background:var(--tag-jeon);color:var(--tag-jeon-t)}
.b-hu{background:var(--tag-hu);color:var(--tag-hu-t)}
.toggle-btn{font-size:.77rem;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;margin-top:9px;font-family:'Noto Sans KR',sans-serif}
.toggle-btn:hover{text-decoration:underline}
.card-detail{margin-top:15px;border-top:1px solid var(--border);padding-top:15px;display:none}
.card-detail.open{display:block}
.detail-section{margin-bottom:20px}
.detail-section:last-child{margin-bottom:0}
.detail-label{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--text);margin-bottom:10px;padding:6px 10px;background:var(--step-bg);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0}
.feature-list{list-style:none;padding:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.feature-list li{font-size:.87rem;line-height:1.75;padding:8px 12px 8px 32px;border-bottom:1px solid var(--border);position:relative;background:var(--surface)}
.feature-list li::before{content:'';position:absolute;left:13px;top:17px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.feature-list li:last-child{border-bottom:none}
.admission-meta{display:flex;flex-direction:column;gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.admission-meta-row{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:.87rem;line-height:1.7}
.admission-meta-row:last-child{border-bottom:none}
.admission-meta-label{flex-shrink:0;font-size:.72rem;font-weight:700;color:var(--muted);width:58px;padding-top:2px}
.admission-meta-value{color:var(--text);flex:1}
.admission-steps{background:var(--step-bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:8px}
.admission-steps-title{font-size:.72rem;font-weight:700;color:var(--muted);padding:7px 12px 5px;border-bottom:1px solid var(--border)}
.admission-step-item{display:flex;flex-direction:column;gap:3px;padding:9px 12px;border-bottom:1px solid var(--border);font-size:.87rem;line-height:1.65}
.admission-step-item:last-child{border-bottom:none}
.admission-step-num{font-size:.75rem;font-weight:700;color:var(--accent)}
.admission-step-text{color:var(--text);padding-left:2px}
.admission-notes{margin-top:8px}
.admission-note-item{font-size:.83rem;color:var(--muted);line-height:1.7;padding:3px 0 3px 12px;position:relative}
.admission-note-item::before{content:'·';position:absolute;left:2px;color:var(--hint)}
.result-table{width:100%;border-collapse:collapse;font-size:.84rem}
.result-table th{background:var(--step-bg);border:1px solid var(--border);padding:7px 11px;font-weight:500;font-size:.76rem;color:var(--muted);text-align:center}
.result-table td{border:1px solid var(--border);padding:8px 11px;text-align:center;color:var(--text)}
.result-table td.empty{color:var(--hint);font-size:.78rem;font-style:italic}
.result-note{font-size:.77rem;color:var(--hint);margin-top:7px;line-height:1.6}

/* ── RESULTS TAB ── */
.class-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:10px}
.class-header h2{font-size:1.1rem;font-weight:500}
.class-meta{font-size:.82rem;color:var(--muted)}
.student-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.student-table{width:100%;border-collapse:collapse;font-size:.87rem}
.student-table th{background:var(--step-bg);border-bottom:1px solid var(--border);padding:10px 14px;font-weight:500;font-size:.78rem;color:var(--muted);text-align:left}
.student-table td{border-bottom:1px solid var(--bg);padding:9px 14px;vertical-align:middle}
.student-table tr:last-child td{border-bottom:none}
.student-table tr:hover td{background:var(--bg)}
.gender-m{color:#1e4a7a;font-size:.75rem;font-weight:500}
.gender-f{color:#8a2040;font-size:.75rem;font-weight:500}
.school-select{width:100%;padding:.38rem .6rem;border:1px solid var(--border);border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:.83rem;background:var(--bg);color:var(--text);outline:none}
.school-select:focus{border-color:var(--accent)}
.ac-wrap{position:relative;width:100%}
.ac-input{width:100%;padding:.42rem .8rem;border:1px solid var(--border);border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:.86rem;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.ac-input:focus{border-color:var(--accent);background:#fff}
.ac-input::placeholder{color:var(--hint)}
.ac-input.has-value{border-color:var(--success);background:var(--success-bg);font-weight:500;color:var(--success)}
.ac-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:0 4px 16px rgba(0,0,0,.08);z-index:200;max-height:220px;overflow-y:auto;display:none}
.ac-dropdown.open{display:block}
.ac-group-label{font-size:.7rem;font-weight:700;color:var(--hint);letter-spacing:.07em;text-transform:uppercase;padding:8px 12px 4px;border-top:1px solid var(--border)}
.ac-group-label:first-child{border-top:none}
.ac-item{padding:7px 14px;font-size:.86rem;cursor:pointer;transition:background .1s}
.ac-item:hover,.ac-item.focused{background:var(--accent-light);color:var(--accent)}
.ac-item mark{background:none;color:var(--accent);font-weight:700}
.ac-empty{padding:12px 14px;font-size:.83rem;color:var(--hint);text-align:center}
.school-input{width:100%;padding:.38rem .6rem;border:1px solid var(--border);border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:.83rem;background:var(--bg);color:var(--text);outline:none;margin-top:5px}
.school-input:focus{border-color:var(--accent)}
.school-input::placeholder{color:var(--hint)}
.pct-wrap{display:flex;align-items:center;gap:4px}
.pct-input{width:72px;padding:.42rem .55rem;border:1px solid var(--border);border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:.85rem;background:var(--bg);color:var(--text);outline:none;text-align:center}
.pct-input:focus{border-color:var(--accent);background:#fff}
.pct-unit{font-size:.78rem;color:var(--muted);white-space:nowrap}
.dept-select{width:100%;margin-top:5px;padding:.38rem .6rem;border:1px solid var(--accent);border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:.82rem;background:#f0f5fc;color:var(--text);outline:none;display:none}
.dept-select.visible{display:block}
.dept-select:focus{border-color:var(--accent)}
.save-row{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.4rem;border-top:1px solid var(--border);background:var(--step-bg)}
.save-btn{padding:.6rem 1.6rem;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:opacity .2s}
.save-btn:hover{opacity:.88}
.save-msg{font-size:.82rem;color:var(--success);display:none}
.status-badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:4px;font-weight:500}
.status-done{background:var(--success-bg);color:var(--success)}
.status-none{background:var(--step-bg);color:var(--hint)}

/* ── OVERVIEW TAB ── */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:1.5rem}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.2rem;cursor:pointer;transition:border-color .18s}
.ov-card:hover{border-color:var(--accent)}
.ov-card h3{font-size:.95rem;font-weight:500;margin-bottom:4px}
.ov-card .ov-teacher{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.ov-progress{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:5px}
.ov-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.ov-count{font-size:.75rem;color:var(--muted)}
.ov-detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-top:1rem}
.ov-detail-header{padding:1rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ov-detail-header h3{font-size:1rem;font-weight:500}
.close-btn{font-size:.8rem;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer}
.close-btn:hover{background:var(--bg)}

/* ── SETUP GUIDE ── */
.setup-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.5rem 1.75rem;margin-bottom:1.2rem}
.setup-box h3{font-size:1rem;font-weight:500;margin-bottom:.3rem}
.setup-box p{font-size:.87rem;color:var(--muted);line-height:1.7;margin-bottom:1rem}
.setup-input{width:100%;padding:.6rem .9rem;border:1px solid var(--border);border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.setup-input:focus{border-color:var(--accent);background:#fff}
.setup-btn{margin-top:.75rem;padding:.6rem 1.4rem;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:.88rem;font-weight:500;cursor:pointer;transition:opacity .2s}
.setup-btn:hover{opacity:.88}
.setup-status{font-size:.82rem;margin-top:.6rem}
.setup-ok{color:var(--success)}
.setup-err{color:#c0392b}
.step-guide{display:flex;flex-direction:column;gap:10px;margin-top:1rem}
.sg-item{display:flex;gap:12px;align-items:flex-start}
.sg-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.sg-text{font-size:.85rem;line-height:1.7;color:var(--text)}
.sg-text code{background:var(--step-bg);padding:1px 6px;border-radius:4px;font-size:.83rem;font-family:monospace}
.no-result{text-align:center;padding:4rem 2rem;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <h1>포산중학교<br>고입 정보 시스템</h1>
    <p class="sub">3학년 담당 선생님만 접근 가능합니다</p>
    <label>이름</label>
    <input type="text" id="inp-name" placeholder="성함을 입력하세요" autocomplete="off">
    <label>비밀번호</label>
    <input type="password" id="inp-pw" placeholder="비밀번호를 입력하세요" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-err" id="login-err">이름 또는 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 앱 -->
<div id="app">
  <header>
    <h1>포산중학교 고입 정보 시스템</h1>
    <div class="user-info">
      <span id="welcome-msg"></span>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('schools',this)">학교 정보</button>
    <button class="tab-btn" onclick="switchTab('results',this)">합격 입력</button>
    <button class="tab-btn" onclick="switchTab('overview',this)">전체 현황</button>
  </div>

  <!-- 학교 정보 탭 -->
  <div id="tab-schools" class="container">
    <div class="filters">
      <input type="text" id="search" placeholder="학교명 또는 키워드 검색..." oninput="renderSchools()">
      <select id="filterType" onchange="renderSchools()">
        <option value="">전체 구분</option>
        <option value="일반고등학교">일반고</option>
        <option value="선지원 일반고">선지원 일반고</option>
        <option value="자율고">자율고</option>
        <option value="영재학교">영재학교</option>
        <option value="특수목적고등학교">특수목적고</option>
        <option value="마이스터고">마이스터고</option>
        <option value="특성화고">특성화고</option>
        <option value="타시도 일반고">타시도 일반고</option>
      </select>
      <select id="filterTerm" onchange="renderSchools()">
        <option value="">전기/후기</option>
        <option value="전기">전기</option>
        <option value="후기">후기</option>
      </select>
    </div>
    <div class="result-count" id="school-count"></div>
    <div id="school-list"></div>
  </div>

  <!-- 합격 입력 탭 -->
  <div id="tab-results" class="container" style="display:none">
    <div id="results-content"></div>
  </div>

  <!-- 전체 현황 탭 -->
  <div id="tab-overview" class="container" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:.85rem;color:var(--muted)">모든 선생님의 입력 현황을 실시간으로 확인할 수 있어요</div>
        <div id="last-sync-time" style="font-size:.78rem;color:var(--hint);margin-top:3px">마지막 갱신: —</div>
      </div>
      <button class="save-btn" style="font-size:.83rem;padding:.45rem 1.1rem" onclick="manualLoad(this)">↻ 지금 불러오기</button>
    </div>
    <div class="overview-grid" id="overview-grid"></div>
    <div id="overview-detail"></div>
  </div>


</div>

<script>
// ── 데이터 ──
const USERS = {
  "이선영":"301","박은진":"302","정지연":"303","이가혜":"304",
  "장정원":"305","차경호":"306","최혜림":"307","이지은":"308",
  "장경진":"309","이병호":"310","박정은":"311","박미정":"312"
};

const TEACHERS = {
  "3-1":"이선영","3-2":"박은진","3-3":"정지연","3-4":"이가혜",
  "3-5":"장정원","3-6":"차경호","3-7":"최혜림","3-8":"이지은",

function badgeClass(type) {

  if(type==='마이스터고') return 'b-master';
  if(type==='영재학교') return 'b-gifted';
  if(type==='자율고') return 'b-auto';

  if(type==='타시도 일반고') return 'b-tasido';

}

function parseFeature(text) {
  if(!text) return '';

  // | 구분자가 있으면 섹션 구조로 렌더링
  if(text.includes('|')) {
    const parts = text.split('|');
    let html = '<ul class="feature-list">';
    // 첫 파트는 일반 불릿
    if(parts[0].trim()) {
      html += `<li>${parts[0].trim()}</li>`;
    }
    // 이후: 헤더|내용 쌍으로 처리
    let i = 1;
    while(i < parts.length) {
      const header = parts[i].trim();
      const body = parts[i+1] ? parts[i+1].trim() : '';
      if(body && !body.match(/^[12]학군/)) {
        // 배정방법처럼 헤더+내용을 한 불릿으로
        const bodyLines = body.split('\n').filter(Boolean)
          .map(l => `<span style="display:block;padding-left:8px;color:var(--muted);font-size:.84rem;line-height:1.7">${l.trim()}</span>`).join('');
        html += `<li><strong>${header}</strong>${bodyLines}</li>`;
        i += 2;
      } else {
        // 학군처럼 헤더가 제목, 다음이 학교 목록
        const schools = parts[i+1] ? parts[i+1].trim() : '';
        html += `<li>
          <strong>${header}</strong>
          <span style="display:block;padding-left:4px;color:var(--muted);font-size:.84rem;line-height:1.75;margin-top:3px">${schools}</span>
        </li>`;
        i += 2;
      }
    }
    html += '</ul>';
    return html;
  }

  // 일반 텍스트는 기존 방식
  const lines = text.split('\n').map(l => {
    let s = l.replace(/^[-·•]\s*/, '').trim();
    s = s.replace(/^학과:\s*/, '');
    s = s.replace(/^※\s*/, '');
    return s;
  }).filter(Boolean);
  return `<ul class="feature-list">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
}

function parseAdmission(text) {
  if(!text) return '';
  const lines = text.split('\n').map(l => l.replace(/^[-·•]\s*/, '').replace(/^※\s*/, '').trim()).filter(Boolean);
  const STEP_RE = /^([0-9]+단계[^:：]*)[：:]\s*(.*)/;

  let rows = [], steps = [];
  lines.forEach(line => {
    const stepMatch = line.match(STEP_RE);
    if(stepMatch) {
      steps.push({ num: stepMatch[1], desc: stepMatch[2] });
    } else {
      // 라벨: 내용 형태면 내용만 추출
      const colonIdx = line.search(/[：:]/);
      const knownLabels = ['모집인원','지원자격','전형방법','전형요소','지원방법','접수방법','모집정원','면접'];
      const hasLabel = colonIdx > 0 && knownLabels.some(k => line.startsWith(k));
      rows.push(hasLabel ? line.slice(colonIdx + 1).trim() : line);
    }
  });

  let html = '';
  if(rows.length) {
    html += `<div class="admission-meta">${rows.map(r=>`<div class="admission-meta-row"><span class="admission-meta-value" style="padding-left:0">${r}</span></div>`).join('')}</div>`;
  }
  if(steps.length) {
    html += `<div class="admission-steps"><div class="admission-steps-title">전형 단계</div>${steps.map(s=>`<div class="admission-step-item"><div class="admission-step-num">${s.num}</div><div class="admission-step-text">${s.desc}</div></div>`).join('')}</div>`;
  }
  return html || `<ul class="feature-list">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
}

// ── 자동완성 ──
let acFocusIdx = {};

function acInput(uid, cls, key, q) {
  const inp = document.getElementById(uid);
  inp.classList.remove('has-value');
  // 선택값 초기화
  if(results[cls]?.[key]?.school) {
    results[cls][key].school = '';
    saveResults();
    updateStatusBadge(uid, cls, key);
  }
  acRenderDropdown(uid, cls, key, q);
}

function acOpen(uid) {
  const inp = document.getElementById(uid);
  if(!inp.classList.contains('has-value')) {
    acRenderDropdown(uid, '', '', inp.value);
  }
}

function acRenderDropdown(uid, cls, key, q) {
  const dd = document.getElementById('dd-'+uid);
  if(!dd) return;
  const trimQ = q.trim().toLowerCase();

  // 전체 목록에서 검색 (구분 포함)
  let html = '';
  let totalCount = 0;

  SCHOOL_GROUPS.forEach(g => {
    const matched = g.schools.filter(s => !trimQ || s.toLowerCase().includes(trimQ));
    if(!matched.length) return;
    totalCount += matched.length;
    html += `<div class="ac-group-label">${g.label}</div>`;
    html += matched.map(s => {
      const hl = trimQ ? s.replace(new RegExp(`(${trimQ})`, 'gi'), '<mark>$1</mark>') : s;
      return `<div class="ac-item" onmousedown="acSelect('${uid}','${cls}','${key}','${s.replace(/'/g,"\\'")}')"> ${hl}</div>`;
    }).join('');
  });

  if(!html) {
    dd.innerHTML = `<div class="ac-empty">검색 결과가 없어요 — 아래 직접 입력 칸을 사용하세요</div>`;
  } else {
    dd.innerHTML = html;
  }

  dd.classList.add('open');
  acFocusIdx[uid] = -1;

  // 외부 클릭 시 닫기
  setTimeout(() => {
    const close = (e) => {
      if(!document.getElementById('wrap-'+uid)?.contains(e.target)) {
        dd.classList.remove('open');
        document.removeEventListener('mousedown', close);
      }
    };
    document.addEventListener('mousedown', close);
  }, 10);
}

function acSelect(uid, cls, key, school) {
  const inp = document.getElementById(uid);
  if(inp) { inp.value = school; inp.classList.add('has-value'); }
  document.getElementById('dd-'+uid)?.classList.remove('open');

  // 학과 드롭다운 처리
  const deptEl = document.getElementById('dept-'+uid);
  if(deptEl) {
    const depts = SCHOOL_DEPTS[school] || [];
    if(depts.length) {
      deptEl.innerHTML = `<option value="">— 학과 선택 —</option>` + depts.map(d=>`<option value="${d}">${d}</option>`).join('');
      deptEl.classList.add('visible');
    } else {
      deptEl.innerHTML = '';
      deptEl.classList.remove('visible');
    }
    // 학과 초기화
    if(cls && key) {
      if(!results[cls]) results[cls]={};
      if(!results[cls][key]) results[cls][key]={school:'',custom:'',cat:'',pct:'',dept:''};
      results[cls][key].dept = '';
    }
  }

  if(cls && key) saveCell(cls, key, 'school', school);
}

function acKey(e, uid, cls, key) {
  const dd = document.getElementById('dd-'+uid);
  if(!dd || !dd.classList.contains('open')) return;
  const items = dd.querySelectorAll('.ac-item');
  if(!items.length) return;
  let idx = acFocusIdx[uid] ?? -1;
  if(e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx+1, items.length-1); }
  else if(e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx-1, 0); }
  else if(e.key === 'Enter' && idx >= 0) {
    e.preventDefault();
    const school = items[idx].textContent.trim();
    acSelect(uid, cls, key, school);
    return;
  } else if(e.key === 'Escape') { dd.classList.remove('open'); return; }
  else return;
  acFocusIdx[uid] = idx;
  items.forEach((el,i) => el.classList.toggle('focused', i===idx));
  items[idx]?.scrollIntoView({block:'nearest'});
}

function updateStatusBadge(uid, cls, key) {
  const inp = document.getElementById(uid);
  const tr = inp?.closest('tr');
  if(!tr) return;
  const r = results[cls]?.[key] || {};
  const isDone = r.school || r.custom;
  const badge = tr.querySelector('.status-badge');
  if(badge) { badge.className='status-badge '+(isDone?'status-done':'status-none'); badge.textContent=isDone?'완료':'미입력'; }
}

function resetClass(cls) {
  if(!confirm(`${cls}반 입력 데이터를 전체 초기화할까요?\nFirebase에서도 삭제됩니다.`)) return;
  results[cls] = {};
  saveResults();
  renderResults();
  renderOverview();
  clearClassData(cls);
}

function onCatChange(cls, key, sel) {}  // 구형 호환용 빈 함수

function saveCell(cls, key, field, value) {
  if(!results[cls]) results[cls]={};
  if(!results[cls][key]) results[cls][key]={school:'',custom:'',cat:'',pct:'',dept:''};
  results[cls][key][field]=value;
  saveResults();
  const isDone=results[cls][key].school||results[cls][key].custom;
  const tr=event.target.closest('tr');
  if(tr){const badge=tr.querySelector('.status-badge');if(badge){badge.className='status-badge '+(isDone?'status-done':'status-none');badge.textContent=isDone?'완료':'미입력';}}
  // Firebase에 해당 학생 저장 (디바운스 1.5초)
  clearTimeout(saveCell._t);
  saveCell._t = setTimeout(() => syncToSheet(cls, key, results[cls][key]), 1500);
  renderOverview();
}

// ── 전체 현황 탭 ──
function renderOverview() {
  const grid=document.getElementById('overview-grid');
  if(!grid) return;
  grid.innerHTML=Object.entries(TEACHERS).map(([cls,teacher])=>{
    const students=CLASSES[cls]||[];
    const clsR=results[cls]||{};
    const done=students.filter(st=>{const r=clsR[`${st.num}-${st.name}`];return r&&(r.school||r.custom);}).length;
    const pct=students.length?Math.round(done/students.length*100):0;
    return `<div class="ov-card" onclick="showOvDetail('${cls}')">
      <h3>${cls}반</h3>
      <div class="ov-teacher">${teacher} 선생님</div>
      <div class="ov-progress"><div class="ov-bar" style="width:${pct}%"></div></div>
      <div class="ov-count">${done} / ${students.length}명 입력 완료 (${pct}%)</div>
    </div>`;
  }).join('');
}

function showOvDetail(cls) {
  const students=CLASSES[cls]||[];
  const clsR=results[cls]||{};
  const teacher=TEACHERS[cls];
  document.getElementById('overview-detail').innerHTML=`
    <div class="ov-detail">
      <div class="ov-detail-header">
        <h3>${cls}반 (${teacher} 선생님) — 합격 현황</h3>
        <button class="close-btn" onclick="document.getElementById('overview-detail').innerHTML=''">닫기</button>
      </div>
      <table class="student-table">
        <thead><tr><th>번호</th><th>이름</th><th>성별</th><th>내신 백분율</th><th>합격 학교</th><th>학과</th></tr></thead>
        <tbody>${students.map(st=>{
          const r=clsR[`${st.num}-${st.name}`]||{};
          const school=r.custom||r.school||'';
          const pct=r.pct?r.pct+'%':'—';
          const dept=r.dept||'—';
          return `<tr>
            <td style="text-align:center;color:var(--muted);font-size:.82rem">${st.num}</td>
            <td style="font-weight:500">${st.name}</td>
            <td style="text-align:center"><span class="${st.gender==='남'?'gender-m':'gender-f'}">${st.gender}</span></td>
            <td style="text-align:center;font-size:.84rem">${pct}</td>
            <td>${school?`<span class="status-badge status-done">${school}</span>`:'<span class="status-badge status-none">미입력</span>'}</td>
            <td style="font-size:.83rem;color:var(--muted)">${school&&r.dept?dept:'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  document.getElementById('overview-detail').scrollIntoView({behavior:'smooth',block:'start'});
}

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function saveResults() {
  // 로컬 저장은 유지 (빠른 렌더링용)
  localStorage.setItem('school_results', JSON.stringify(results));
}

function showSyncMsg(msg, isErr=false) {
  const el = document.getElementById('save-msg');
  if(!el) return;
  el.textContent = msg;
  el.style.color = isErr ? '#c0392b' : 'var(--success)';
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2500);
}

// 학생 1명 Firebase에 저장
function syncToSheet(cls, key, studentData) {
  if(!cls || !key) return;
  const r = studentData || results[cls]?.[key] || {};
  const safeCls = cls.replace(/-/g, '__');
  const safeKey = encodeURIComponent(key).replace(/\./g, '%2E');
  db.ref(`results/${safeCls}/${safeKey}`).set({
    school: r.school||'', custom: r.custom||'',
    dept: r.dept||'', pct: r.pct||'',
    cls: cls, key: key,
    updatedAt: new Date().toLocaleString('ko-KR')
  }).then(() => showSyncMsg('✓ 저장됐어요'))
    .catch(() => showSyncMsg('⚠ 저장 실패', true));
}

// 해당 반 전체 Firebase에서 삭제
function clearClassData(cls) {
  const safeCls = cls.replace(/-/g, '__');
  db.ref(`results/${safeCls}`).remove()
    .then(() => showSyncMsg('✓ 초기화됐어요'))
    .catch(() => showSyncMsg('⚠ 초기화 실패', true));
}

// Firebase 데이터 → results 반영
function applyFirebaseData(data) {
  // 시트에 있는 반은 완전히 교체
  const sheetResults = {};
  if(data) {
    Object.entries(data).forEach(([safeCls, students]) => {
      Object.entries(students).forEach(([safeKey, val]) => {
        const cls = val.cls || safeCls.replace(/__/g, '-');
        const key = val.key || decodeURIComponent(safeKey);
        if(!sheetResults[cls]) sheetResults[cls] = {};
        sheetResults[cls][key] = {
          school: val.school||'', custom: val.custom||'',
          dept: val.dept||'', pct: val.pct||'', cat:''
        };
      });
    });
  }
  // Firebase에 있는 반만 교체 (없는 반은 로컬 유지)
  Object.keys(sheetResults).forEach(cls => {
    results[cls] = sheetResults[cls];
  });
  // Firebase에서 삭제된 반은 로컬도 초기화
  Object.keys(results).forEach(cls => {
    const safeCls = cls.replace(/-/g, '__');
    if(data && !data[safeCls]) {
      results[cls] = {};
    }
  });
  saveResults();
  renderResults();
  renderOverview();
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
  const el = document.getElementById('last-sync-time');
  if(el) el.textContent = `마지막 갱신: ${timeStr}`;
}

// Firebase 실시간 리스너
function startRealtimeSync() {
  db.ref('results').on('value', (snapshot) => {
    applyFirebaseData(snapshot.val());
  });
}

// 수동 불러오기 버튼
function manualLoad(btn) {
  btn.textContent = '불러오는 중...';
  btn.disabled = true;
  btn.style.opacity = '0.6';
  db.ref('results').get().then(snapshot => {
    applyFirebaseData(snapshot.val());
    showSyncMsg(snapshot.val() ? '✓ 최신 데이터를 불러왔어요' : '데이터가 없어요');
  }).catch(() => showSyncMsg('⚠ 불러오기 실패', true))
    .finally(() => {
      btn.textContent = '↻ 지금 불러오기';
      btn.disabled = false;
      btn.style.opacity = '1';
    });
}

// 로그인 후 실시간 동기화 시작
setTimeout(() => { if(currentUser) startRealtimeSync(); }, 500);
